#### datasets
datasets:
  name: RSBlur # Name of the Dataset used for training (check create_data function for available names)
  seed: 42 # random seed for reproducibility

  train:
    train_path: ./data/dataset # training set path
    n_workers: 16  # per GPU number of workers
    batch_size_train: [2] # STEP total batch size for each step
    cropsize: [1200,1920]   # STEP size you want to crop (single int for squared, list for rectangular) out as input sample in each step. None for original size.
    flips: True # whether to use horizontal/vertical flips
    verbose: True # whether to print the dataset information
    crop_type: Random # type of crop to be used (Random, Center). If cropsize not None, this parameter is used.
  val:
    test_path: ./data/dataset # test set path
    batch_size_test: 1 # batch size for validation

#### network structures
network:
  name: NAFNet # name of the network used. Check create_model function for available names
  resume_training: True # whether to resume training from a checkpoint

#### network parameters, you may define the names that you want to use in the network. Unused keys will be ignored.
  img_channels: 3
  width: 16
  middle_blk_num: 2
  enc_blk_nums: [1,1,1,24]
  dec_blk_nums: [1,1,1,1]


#### training settings: learning rate scheme, loss
train:
  # parameters of the optimizer
  lr_initial: !!float 1e-4      # ĐÃ GIẢM LR ĐỂ ATTENTION CHẠY MƯỢT
  betas: [0.9, 0.999]           # Chuẩn cho AdamW có Transformer
  weight_decay: !!float 1e-4    # Giảm chút xíu để model học chi tiết tốt hơn
  # parameter of the scheduler
  lr_scheme: CosineAnnealing
  lr_gamma: 0.5
  eta_min: !!float 1e-6

  STEPS: 1 # number of steps of the multi-step training. If only one step is needed, set it to 1. Then only the first values of the lists will be used.


  epochs: [100] # STEP number of epochs for each step
  eval_freq: 5 # frequency of evaluation (in epochs)
 # loss parameters (the same keys are defined for each loss)

  pixel_flag: [True]
  pixel_criterion: MultiScaleCharbonnier 
  pixel_weight: [1.0]
  pixel_reduction: mean 

  perceptual_flag: [False]


  edge_flag: [True]
  edge_criterion: l2
  edge_weight: [0.05] 
  edge_reduction: mean

  fft_flag: [True]
  fft_weight: [0.01] 

  # STEPS: 2 # Bật chế độ 2 giai đoạn
  # epochs: [20, 180] 
  # eval_freq: 5 

  # pixel_flag: [True, True] 
  # pixel_criterion: MultiScaleCharbonnier 
  # pixel_weight: [1.0, 1.0] 
  # pixel_reduction: mean 

  # perceptual_flag: [False, False]
  # perceptual_criterion: l1
  # perceptual_weight: [0.01, 0.01]
  # perceptual_reduction: mean

  # edge_flag: [False, True]
  # edge_criterion: l2
  # edge_weight: [0.0, 0.01] 
  # edge_reduction: mean

  # fft_flag: [False, True]
  # fft_weight: [0.0, 0.005]

#### save model
save:
  path_resume:  ./models/.pt # path to the checkpoint to resume training
  path_save: ./models/.pt # path to save the model



